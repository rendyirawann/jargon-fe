org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kompilasi inkremental Kotlin DIMATIKAN.
#
# Cache inkrementalnya menyimpan path relatif, dan itu rusak bila
# pub-cache berada di drive yang berbeda dari proyek (mis. pub-cache di
# D:\ sementara proyek di C:\). Gejalanya di Windows:
#
#   java.lang.IllegalArgumentException: this and base files have
#   different roots
#   > Could not close incremental caches in ...
#
# Build gagal seluruhnya, dan pesannya tidak menyebutkan drive sama
# sekali. Biayanya build sedikit lebih lambat; imbalannya build yang
# berhasil di mesin mana pun tanpa peduli letak pub-cache.
kotlin.incremental=false

# Pemeriksaan kesesuaian target JVM diturunkan dari GALAT menjadi
# PERINGATAN.
#
# Beberapa plugin Flutter menyetel Java 11 lewat DSL android.compileOptions
# miliknya sendiri, sementara Kotlin-nya mengikuti nilai proyek (17).
# Ketidaksesuaian itu tidak bisa diperbaiki dari luar plugin: AGP menetapkan
# target Java dari DSL plugin, bukan dari task yang bisa dikonfigurasi
# proyek induk.
#
# Mengapa aman: keluaran Java dan Kotlin adalah berkas .class terpisah di
# dalam satu AAR. Yang menentukan apakah keduanya bisa dijalankan adalah
# target modul :app (17) — dan 17 dapat memuat kelas 11. Yang TIDAK aman
# adalah kebalikannya, dan itu tidak terjadi di sini.
#
# Tanpa ini, satu plugin yang belum menyesuaikan diri membuat seluruh build
# release gagal - dan itu di luar kendali repositori ini.
kotlin.jvm.target.validation.mode=warning
