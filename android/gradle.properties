org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kompilasi inkremental Kotlin DIMATIKAN.
#
# Cache inkrementalnya menyimpan path relatif, dan itu rusak bila
# pub-cache berada di drive yang berbeda dari proyek (mis. pub-cache di
# D:\ sementara proyek di C:\). Gejalanya di Windows:
#
#   java.lang.IllegalArgumentException: this and base files have
#   different roots
#   > Could not close incremental caches in ...
#
# Build gagal seluruhnya, dan pesannya tidak menyebutkan drive sama
# sekali. Biayanya build sedikit lebih lambat; imbalannya build yang
# berhasil di mesin mana pun tanpa peduli letak pub-cache.
kotlin.incremental=false
