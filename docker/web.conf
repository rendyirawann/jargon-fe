# =====================================================================
# Penyaji berkas statis untuk aplikasi web Jargon GO.
#
# Container ini TIDAK diakses langsung oleh browser; ia berada di belakang
# nginx penyatu (lihat jargon-be/infra/nginx/absensi.conf). Karena itu di
# sini tidak ada aturan CORS maupun proxy ke API — keduanya urusan nginx
# penyatu, dan aplikasi memanggil API di origin yang sama.
# =====================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Flutter web adalah SPA: seluruh rute ditangani di sisi klien, jadi
    # permintaan ke path apa pun harus mengembalikan index.html. Tanpa ini,
    # menyegarkan halaman di rute selain akar menghasilkan 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nama berkas bundel Flutter memuat hash, jadi aman di-cache lama.
    location ~* \.(js|wasm|css|png|jpg|jpeg|svg|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # index.html dan manifes TIDAK boleh di-cache: keduanya yang menunjuk ke
    # bundel versi baru. Meng-cache-nya berarti pengguna tetap memakai versi
    # lama setelah deploy, dan tidak ada cara memaksanya menyegarkan.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /version.json {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;
    gzip_min_length 1024;
}
